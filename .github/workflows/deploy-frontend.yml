name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Azure Blob Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env.local
        working-directory: frontend
        run: |
          echo "NEXT_PUBLIC_API_URL=https://api.intervyu.io" > .env.local
          echo "NEXT_PUBLIC_WS_URL=wss://api.intervyu.io" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Copy VAD assets
        working-directory: frontend
        run: npm run copy-vad-assets

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name intervyufrontend \
            --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
            --source frontend/out \
            --destination '$web' \
            --overwrite \
            --content-cache-control "no-cache, no-store, must-revalidate" \
            --pattern "*.html"

          az storage blob upload-batch \
            --account-name intervyufrontend \
            --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
            --source frontend/out \
            --destination '$web' \
            --overwrite
